[package]
name = "hoo-browser"
version = "0.1.10"
edition = "2021"
description = "Tier C native helper: one shared Chromium driven via the agent-browser CLI, scoped per-agent leases over MCP Streamable HTTP"
license = "MIT"
repository = "https://github.com/kolisachint/hoo-browser-plugin"

[lib]
name = "hoo_browser"
path = "src/lib.rs"

[[bin]]
name = "hoo-browser"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
rmcp = { version = "3.8.0", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
    "client",
    "transport-streamable-http-client",
    "transport-streamable-http-client-unix-socket",
] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.9"
libc = "0.2"
sha2 = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
