name: release

# On tag v*: build the four platform binaries as plain files (hoocode refuses
# archives), upload them to the release, and print the sha256s so the manifest
# PR can pin them via scripts/update_manifest.py.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: cross toolchain (linux-aarch64)
        if: matrix.platform == 'linux-aarch64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: stage plain binary
        run: cp target/${{ matrix.target }}/release/hoo-browser hoo-browser-${{ matrix.platform }}
      - name: print sha256
        run: sha256sum hoo-browser-${{ matrix.platform }}
      - name: upload
        uses: softprops/action-gh-release@v2
        with:
          files: hoo-browser-${{ matrix.platform }}
          fail_on_unmatched_files: true
